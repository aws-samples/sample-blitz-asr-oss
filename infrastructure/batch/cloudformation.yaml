AWSTemplateFormatVersion: '2010-09-09'
Description: 'Blitz ASR - AWS Batch Infrastructure for S3-triggered transcription'

# ============================================================================
# Parameters
# ============================================================================
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Environment name

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for Batch compute environment

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets for Batch compute environment (private subnets recommended)

  ECRImageUri:
    Type: String
    Description: Full ECR image URI (e.g., 123456789012.dkr.ecr.us-east-1.amazonaws.com/blitz-batch:latest)

  MaxvCpus:
    Type: Number
    Default: 32
    Description: Maximum vCPUs for the compute environment

  InstanceTypes:
    Type: CommaDelimitedList
    Default: "g6.xlarge"
    Description: GPU instance types for Batch (L4)

  SpotBidPercentage:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 100
    Description: Maximum Spot price as percentage of On-Demand (0 = On-Demand only)

  Tier2Backend:
    Type: String
    Default: nemo
    AllowedValues: [nemo, onnx]
    Description: Tier 2 (Parakeet 0.6B) backend (nemo = PyTorch, onnx = ONNX Runtime)

  Tier2Precision:
    Type: String
    Default: bfloat16
    AllowedValues: [fp32, bfloat16, fp16]
    Description: Tier 2 model precision (bfloat16 recommended, fp16 for ONNX)

  CreateS3VpcEndpoint:
    Type: String
    Default: 'No'
    AllowedValues: ['Yes', 'No']
    Description: Create a gateway VPC endpoint for S3 (set No if one already exists in the VPC)

  S3VpcEndpointRouteTableIds:
    Type: CommaDelimitedList
    Default: ''
    Description: Route table IDs the S3 gateway endpoint should attach to (only used when CreateS3VpcEndpoint=Yes)

# ============================================================================
# Resources
# ============================================================================
Resources:

  # --------------------------------------------------------------------------
  # KMS CMK - encrypts the CloudWatch log group
  # --------------------------------------------------------------------------
  EncryptionKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub 'Blitz ASR batch CMK (logs) - ${Environment}'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableRootAccountAdmin
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowCloudWatchLogs
            Effect: Allow
            Principal:
              Service: !Sub 'logs.${AWS::Region}.amazonaws.com'
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:Describe*
            Resource: '*'
            Condition:
              ArnLike:
                'kms:EncryptionContext:aws:logs:arn': !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/batch/blitz-${Environment}'

  # --------------------------------------------------------------------------
  # S3 Buckets
  # --------------------------------------------------------------------------
  AccessLogBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'blitz-logs-${Environment}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: ObjectWriter
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # Self-logging: the access-log bucket records its own access under a
      # dedicated prefix (CKV_AWS_18).
      LoggingConfiguration:
        LogFilePrefix: access-log-bucket/
      LifecycleConfiguration:
        Rules:
          - Id: ArchiveThenExpireAccessLogs
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
            Transitions:
              - StorageClass: GLACIER
                TransitionInDays: 10
            ExpirationInDays: 90
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: blitz-asr

  InputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'blitz-input-${Environment}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogBucket
        LogFilePrefix: input-bucket/
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: blitz-asr

  OutputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'blitz-output-${Environment}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogBucket
        LogFilePrefix: output-bucket/
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldTranscripts
            Status: Enabled
            ExpirationInDays: 90
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: blitz-asr

  InputBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref InputBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt InputBucket.Arn
              - !Sub '${InputBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': false

  OutputBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref OutputBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt OutputBucket.Arn
              - !Sub '${OutputBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': false

  # Optional gateway endpoint: keeps Batch<->S3 traffic on the AWS backbone,
  # cutting NAT gateway cost for high-volume audio I/O. Set
  # CreateS3VpcEndpoint=No if the VPC already has an S3 endpoint.
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateS3Endpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      RouteTableIds: !Ref S3VpcEndpointRouteTableIds

  AccessLogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AccessLogBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt AccessLogBucket.Arn
              - !Sub '${AccessLogBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': false
          - Sid: AllowS3ServerAccessLogging
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${AccessLogBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': true

  # --------------------------------------------------------------------------
  # IAM Roles
  # --------------------------------------------------------------------------
  BatchServiceRole:
    Type: AWS::IAM::Role
    Metadata:
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-IAM4
            reason: >-
              AWS Batch requires its AWS-managed service-role policy
              (AWSBatchServiceRole). This is the AWS-recommended role for the
              Batch service and cannot be replaced with a narrower inline policy.
    Properties:
      RoleName: !Sub 'blitz-batch-service-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: batch.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSBatchServiceRole

  BatchInstanceRole:
    Type: AWS::IAM::Role
    Metadata:
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-IAM4
            reason: >-
              ECS-on-EC2 container instances require the AWS-managed
              AmazonEC2ContainerServiceforEC2Role, and SSM Session Manager
              access (no inbound SSH) requires AmazonSSMManagedInstanceCore.
              Both are AWS-recommended managed policies for these roles.
    Properties:
      RoleName: !Sub 'blitz-batch-instance-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  BatchInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub 'blitz-batch-instance-profile-${Environment}'
      Roles:
        - !Ref BatchInstanceRole

  BatchJobRole:
    Type: AWS::IAM::Role
    Metadata:
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-IAM5
            reason: >-
              Deferred (see docs/security-exceptions.md). Object-level S3 access
              requires an object-path wildcard (arn:.../*); it is already scoped
              to the specific blitz input/output buckets, and actions are limited
              to Get/Put/List. This is least-privilege for a job that processes
              arbitrary object keys within those buckets.
    Properties:
      RoleName: !Sub 'blitz-batch-job-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource:
                  - !Sub '${InputBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource:
                  - !Sub '${OutputBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !GetAtt InputBucket.Arn
                  - !GetAtt OutputBucket.Arn
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/batch/blitz-*'

  BatchExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-IAM4
            reason: >-
              ECS task execution requires the AWS-managed
              AmazonECSTaskExecutionRolePolicy to pull images and write logs.
          - id: AwsSolutions-IAM5
            reason: >-
              ecr:GetAuthorizationToken does not support resource-level
              permissions and must use Resource '*' per AWS documentation. All
              other ECR actions are scoped to the blitz-* repositories.
    Properties:
      RoleName: !Sub 'blitz-batch-execution-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ECRAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'  # GetAuthorizationToken does not support resource-level permissions
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: !Sub 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/blitz-*'

  EventBridgeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'blitz-eventbridge-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SubmitBatchJob
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - batch:SubmitJob
                Resource:
                  - !Ref BatchJobDefinition
                  - !Ref BatchJobQueue

  # --------------------------------------------------------------------------
  # Security Group
  # --------------------------------------------------------------------------
  BatchSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub 'blitz-batch-sg-${Environment}'
      GroupDescription: Security group for Blitz Batch compute instances
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic
      Tags:
        - Key: Name
          Value: !Sub 'blitz-batch-sg-${Environment}'

  # --------------------------------------------------------------------------
  # CloudWatch Log Group
  # --------------------------------------------------------------------------
  BatchLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/batch/blitz-${Environment}'
      RetentionInDays: 30
      KmsKeyId: !GetAtt EncryptionKey.Arn

  # --------------------------------------------------------------------------
  # Launch Template for GPU instances with 100GB disk
  # --------------------------------------------------------------------------
  BatchLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub 'blitz-batch-gpu-${Environment}'
      LaunchTemplateData:
        MetadataOptions:
          HttpTokens: required  # IMDSv2 only — blocks SSRF-to-credentials
          HttpPutResponseHopLimit: 1
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 100
              VolumeType: gp3
              DeleteOnTermination: true
              Encrypted: true

  # --------------------------------------------------------------------------
  # AWS Batch Resources
  # --------------------------------------------------------------------------
  BatchComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    DependsOn: BatchLaunchTemplate
    Properties:
      ComputeEnvironmentName: !Sub 'blitz-gpu-${Environment}'
      Type: MANAGED
      State: ENABLED
      # Tracks the latest GPU-optimized ECS AMI (AL2023 + NVIDIA drivers) so
      # new instances pick up security patches automatically instead of
      # pinning to whatever AMI was current at stack creation time.
      UpdateToLatestImageVersion: true
      ComputeResources:
        Type: !If [UseSpot, SPOT, EC2]
        AllocationStrategy: !If [UseSpot, SPOT_CAPACITY_OPTIMIZED, BEST_FIT_PROGRESSIVE]
        SpotIamFleetRole: !If [UseSpot, !Sub 'arn:aws:iam::${AWS::AccountId}:role/aws-ec2-spot-fleet-tagging-role', !Ref 'AWS::NoValue']
        BidPercentage: !If [UseSpot, !Ref SpotBidPercentage, !Ref 'AWS::NoValue']
        MinvCpus: 0
        MaxvCpus: !Ref MaxvCpus
        DesiredvCpus: 0
        InstanceTypes: !Ref InstanceTypes
        InstanceRole: !GetAtt BatchInstanceProfile.Arn
        Ec2Configuration:
          - ImageType: ECS_AL2023_NVIDIA
        LaunchTemplate:
          LaunchTemplateId: !Ref BatchLaunchTemplate
          Version: !GetAtt BatchLaunchTemplate.LatestVersionNumber
        SecurityGroupIds:
          - !Ref BatchSecurityGroup
        Subnets: !Ref SubnetIds
        Tags:
          Environment: !Ref Environment
          Project: blitz-asr

  BatchJobQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: !Sub 'blitz-transcription-${Environment}'
      State: ENABLED
      Priority: 1
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref BatchComputeEnvironment

  BatchJobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      JobDefinitionName: !Sub 'blitz-transcribe-${Environment}'
      Type: container
      PlatformCapabilities:
        - EC2
      RetryStrategy:
        Attempts: 2
        EvaluateOnExit:
          - Action: RETRY
            OnStatusReason: 'Host EC2*'
          - Action: EXIT
            OnReason: '*'
      Timeout:
        AttemptDurationSeconds: 3600  # 1 hour max per job
      ContainerProperties:
        Image: !Ref ECRImageUri
        JobRoleArn: !GetAtt BatchJobRole.Arn
        ExecutionRoleArn: !GetAtt BatchExecutionRole.Arn
        Command:
          - '--input-bucket'
          - 'Ref::input-bucket'
          - '--input-key'
          - 'Ref::input-key'
        ResourceRequirements:
          - Type: VCPU
            Value: '4'
          - Type: MEMORY
            Value: '15360'  # 15GB (leaving room for ECS agent)
          - Type: GPU
            Value: '1'
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref BatchLogGroup
            awslogs-region: !Ref AWS::Region
            awslogs-stream-prefix: blitz
        Environment:
          - Name: OUTPUT_BUCKET_NAME
            Value: !Ref OutputBucket
          - Name: OUTPUT_PREFIX
            Value: transcripts/
          - Name: TIER2_BACKEND
            Value: !Ref Tier2Backend
          - Name: TIER2_PRECISION
            Value: !Ref Tier2Precision
          - Name: SKIP_SILENCE
            Value: 'true'
          - Name: INCLUDE_TIMESTAMPS
            Value: 'true'
          - Name: INCLUDE_METRICS
            Value: 'true'
          - Name: AWS_REGION
            Value: !Ref AWS::Region
        LinuxParameters:
          SharedMemorySize: 4096  # 4GB shared memory for GPU

  # --------------------------------------------------------------------------
  # EventBridge Rule for S3 Triggers
  # --------------------------------------------------------------------------
  S3TriggerRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub 'blitz-s3-trigger-${Environment}'
      Description: Trigger Blitz transcription on S3 audio upload
      State: ENABLED
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - Object Created
        detail:
          bucket:
            name:
              - !Ref InputBucket
          object:
            key:
              - suffix: .mp3
              - suffix: .wav
              - suffix: .m4a
              - suffix: .flac
              - suffix: .ogg
              - suffix: .webm
              - suffix: .MP3
              - suffix: .WAV
              - suffix: .M4A
              - suffix: .FLAC
      Targets:
        - Id: BlitzBatchJob
          Arn: !Ref BatchJobQueue
          RoleArn: !GetAtt EventBridgeRole.Arn
          BatchParameters:
            JobDefinition: !Ref BatchJobDefinition
            JobName: blitz-transcribe
          InputTransformer:
            InputPathsMap:
              bucket: $.detail.bucket.name
              key: $.detail.object.key
            InputTemplate: |
              {
                "Parameters": {
                  "input-bucket": "<bucket>",
                  "input-key": "<key>"
                }
              }

# ============================================================================
# Conditions
# ============================================================================
Conditions:
  UseSpot: !Not [!Equals [!Ref SpotBidPercentage, 0]]
  CreateS3Endpoint: !Equals [!Ref CreateS3VpcEndpoint, 'Yes']

# ============================================================================
# Outputs
# ============================================================================
Outputs:
  InputBucketName:
    Description: S3 bucket for audio input
    Value: !Ref InputBucket
    Export:
      Name: !Sub '${AWS::StackName}-InputBucket'

  OutputBucketName:
    Description: S3 bucket for transcription output
    Value: !Ref OutputBucket
    Export:
      Name: !Sub '${AWS::StackName}-OutputBucket'

  AccessLogBucketName:
    Description: S3 bucket storing access logs for input/output buckets
    Value: !Ref AccessLogBucket
    Export:
      Name: !Sub '${AWS::StackName}-AccessLogBucket'

  JobQueueArn:
    Description: ARN of the Batch job queue
    Value: !Ref BatchJobQueue
    Export:
      Name: !Sub '${AWS::StackName}-JobQueue'

  JobDefinitionArn:
    Description: ARN of the Batch job definition
    Value: !Ref BatchJobDefinition
    Export:
      Name: !Sub '${AWS::StackName}-JobDefinition'

  LogGroupName:
    Description: CloudWatch log group for batch jobs
    Value: !Ref BatchLogGroup
    Export:
      Name: !Sub '${AWS::StackName}-LogGroup'

  UsageInstructions:
    Description: How to use the batch transcription service
    Value: !Sub |
      Upload audio files to s3://${InputBucket}/
      Transcripts will appear in s3://${OutputBucket}/transcripts/
      Monitor jobs at https://${AWS::Region}.console.aws.amazon.com/batch/
      View logs at https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?#logsV2:log-groups/log-group/$252Faws$252Fbatch$252Fblitz-${Environment}
