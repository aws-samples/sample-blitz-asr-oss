[project]
name = "blitz"
version = "1.0.0"
description = "High-performance ASR with intelligent language routing using NVIDIA Parakeet and OpenAI Whisper"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Brian Maguire" }
]
keywords = ["asr", "speech-recognition", "transcription", "whisper", "parakeet", "nvidia"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    # Core Web Framework
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6,<1",
    # Audio Processing
    "numpy>=1.24.0",
    "soundfile>=0.12.1",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    # ASR Models
    "transformers>=5.10.1",
    "nemo_toolkit[asr]>=2.0.0",
    "speechbrain>=1.0.0",
    "faster-whisper>=1.0.0,<2",
    "sentencepiece>=0.1.99,<1",
    # Configuration & Data Validation
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "omegaconf>=2.3.0",
    # HTTP Client
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
onnx = [
    "onnx-asr>=0.1.0",
    "onnxruntime-gpu>=1.16.0",
    "huggingface-hub>=0.19.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
]

[project.urls]
Repository = "https://github.com/bmaguiraz/github-oss"

[project.scripts]
blitz = "blitz.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blitz"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["blitz"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
