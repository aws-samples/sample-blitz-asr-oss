# =============================================================================
# Observability Stack for Blitz ASR
# =============================================================================
# Adds Prometheus + Grafana alongside the Blitz container.
#
# Usage:
#   # Start blitz + observability stack
#   docker compose -f docker-compose.yml -f observability/docker-compose.observability.yml up -d
#
#   # Access:
#   - Blitz API:    http://localhost:8000
#   - Prometheus:   http://localhost:9090
#   - Grafana:      http://localhost:3000 (admin/admin)
#
# =============================================================================

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: blitz-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - blitz-network

  grafana:
    image: grafana/grafana:latest
    container_name: blitz-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    networks:
      - blitz-network
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:

networks:
  blitz-network:
    external: true
