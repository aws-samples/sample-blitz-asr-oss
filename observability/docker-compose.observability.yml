# =============================================================================
# Observability Stack for Blitz ASR
# =============================================================================
# Adds Prometheus + Grafana alongside the Blitz container.
#
# Usage:
#   # Start blitz + observability stack
#   docker compose -f docker-compose.yml -f observability/docker-compose.observability.yml up -d
#
#   # Access (bound to localhost only):
#   - Blitz API:    http://localhost:8000
#   - Prometheus:   http://localhost:9090
#   - Grafana:      http://localhost:3000
#
#   Grafana admin credentials are supplied via the environment (see
#   .env.example). GRAFANA_ADMIN_PASSWORD is REQUIRED; compose refuses to
#   start without it. Never bake credentials into this file.
#
# =============================================================================

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: blitz-prometheus
    # Bind to localhost only: Prometheus has no auth and exposes the
    # lifecycle API (--web.enable-lifecycle). Front with a TLS proxy for
    # remote access.
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - blitz-network

  grafana:
    image: grafana/grafana:latest
    container_name: blitz-grafana
    # Bind to localhost only; front with an authenticated TLS reverse proxy
    # for remote access.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Credentials come from the environment. GRAFANA_ADMIN_PASSWORD is
      # required — compose fails fast if it is unset, so no default admin
      # password is ever shipped.
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set (see .env.example)}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    networks:
      - blitz-network
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:

networks:
  blitz-network:
    external: true
